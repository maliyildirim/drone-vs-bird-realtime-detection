# GUI runtime configuration for the two-stage drone-vs-bird pipeline

detector:
  model_path: "models/detector_yolov26m_target.pt"
  image_size_image: 960
  image_size_video: 640
  confidence_threshold: 0.30
  iou_threshold: 0.60
  max_detections: 80
  min_box_size_px: 7

classifier:
  model_path: "models/classifier_yolo11m_wbg.pt"
  image_size: 224
  crop_padding: 0.35
  min_confidence: 0.60

video:
  frame_skip: 1
  display_scale: 0.75

gui:
  save_dir: "outputs"
  show_confidence: false
